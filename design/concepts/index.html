<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anou · M0 concepts</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;margin:0;padding:24px;background:#efe9df;color:#1a1a1a}
h1{font-size:22px;margin:0 0 4px} p{margin:0 0 20px;color:#555}
.c{margin:0 0 36px} .c h2{margin:0 0 4px;font-size:18px} .c p{margin:0 0 10px}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.row a{flex:none;text-decoration:none;color:inherit;font-size:13px;text-align:center}
.row img{width:180px;display:block;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);margin-bottom:6px}
</style></head><body>
<h1>Anou · three concept directions (M0)</h1>
<p>Each screenshot opens the live prototype. Brief screens switch the conditions-matched hero with <code>?c=calm</code> / <code>?c=windy</code>.</p>
<script>
const C=[['a','A · Window','The photo is the room; the UI is a sheet of paper laid on it.'],
['b','B · Postmark','Every day is a postcard home; photos live inside perforated stamps.'],
['c','C · Sega','Today\'s condition is one huge word, and the clip plays inside it.']];
const S=[['landing','landing.html','Landing + install'],['brief','brief.html','Brief · calm'],['brief-windy','brief.html?c=windy','Brief · windy'],['tonight','tonight.html','Tonight'],['passport','passport.html','Passport']];
document.write(C.map(([k,t,d])=>`<section class="c"><h2>${t}</h2><p>${d} <a href="${k}/README.md">README</a></p><div class="row">${S.map(([s,u,l])=>`<a href="${k}/${u}"><img src="${k}/shots/${s}.png" alt="${t} ${l}">${l}</a>`).join('')}</div></section>`).join(''));
</script></body></html>
